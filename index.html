<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B26">
<title>Ledger trading journal</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1B26;--surface:#152635;--line:#22384A;--text:#E4ECF1;--muted:#8EA3B3;
  --accent:#E3A43C;--win:#35B98A;--loss:#E5605A;--on-accent:#111;
  --r-sm:6px;--r:12px;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:24px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.brand{font-weight:800;font-stretch:125%;font-size:23px;letter-spacing:-.02em;padding:0 12px 22px;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:22px;background:var(--accent);border-radius:2px;display:inline-block}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:var(--r-sm);color:var(--muted);cursor:pointer;font-weight:500}
nav.side button:hover{color:var(--text);background:color-mix(in srgb,var(--surface) 60%,transparent)}
nav.side button.on{color:var(--text);background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
nav.side svg{width:18px;height:18px;flex:none}
.install{margin:12px 12px 0;display:flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text);padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:14px}
.install[hidden]{display:none}
.install svg{width:16px;height:16px}
.install:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.side-foot{margin-top:auto;padding:12px;color:var(--muted);font-size:12px;line-height:1.4}

main{padding:28px 32px 96px;width:100%;max-width:1360px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:30px;line-height:1.1;font-weight:800;font-stretch:118%;letter-spacing:-.02em;margin:0}
h2{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:-.005em}
h3{font-size:14px;font-weight:600;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pos{color:var(--win)}.neg{color:var(--loss)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:16px}
.stack>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.spacer{flex:1}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 45%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=color]{padding:2px;width:44px;height:34px;cursor:pointer}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.5}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f > *{color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow-x:auto;max-width:100%}
.seg button{white-space:nowrap}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;background:none}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.chip.bad.on{border-color:var(--loss);background:color-mix(in srgb,var(--loss) 16%,transparent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filters select{max-width:180px}

/* motivation */
.motive{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px;border-radius:var(--r);margin-bottom:16px;
  background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
.motive .bar{width:4px;align-self:stretch;background:var(--accent);border-radius:2px}
.motive .msg{font-size:16px;font-weight:600;line-height:1.4;margin-bottom:4px}
.motive .ctx{font-size:13px;color:var(--muted)}
.motive .rule{font-size:13px;margin-top:6px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px}

/* hero */
.hero{position:relative;padding:20px 20px 8px}
.hero .big{font-size:clamp(34px,5vw,54px);font-weight:800;font-stretch:122%;letter-spacing:-.03em;line-height:1}
.hero .meta{color:var(--muted);font-size:13px;margin-top:6px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;font-size:12px;white-space:nowrap;display:none;z-index:2}
.ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.gridl{stroke:var(--line);stroke-width:1}
.zero{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1;opacity:.6}
.eqline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.eqarea{fill:var(--accent);opacity:.12}
.ddarea{fill:var(--loss);opacity:.35}
.barw{fill:var(--win)}.barl{fill:var(--loss)}
.cross{stroke:var(--muted);stroke-width:1}
.dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}

/* stat ledger */
.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ledger > div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ledger > div:nth-child(4n){border-right:0}
.ledger .k{font-size:12.5px;color:var(--muted)}
.ledger .v{font-size:22px;font-weight:700;font-stretch:110%;letter-spacing:-.01em;margin-top:2px}
.ledger .s{font-size:12.5px;color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--muted);padding:2px 4px}
.cal .d{min-height:64px;border-radius:var(--r-sm);padding:5px 6px;background:color-mix(in srgb,var(--bg) 55%,var(--surface));font-size:12px;cursor:pointer;border:1px solid transparent;display:flex;flex-direction:column}
.cal .d:hover{border-color:var(--muted)}
.cal .d.out{opacity:.25;cursor:default}
.cal .d.today{border-color:var(--accent)}
.cal .d b{font-size:13px;font-weight:700;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:clip}
b{white-space:nowrap}
.cal .wk{min-height:64px;border-radius:var(--r-sm);padding:5px 8px;font-size:12px;border:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center}
.cal .wk b{font-size:13px}

/* breakdown bars */
.bd{display:grid;gap:6px}
.bd .r{display:grid;grid-template-columns:minmax(70px,1fr) 1.4fr auto;gap:10px;align-items:center;font-size:13px}
.bd .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .trk{position:relative;height:10px;background:color-mix(in srgb,var(--bg) 60%,var(--surface));border-radius:3px}
.bd .trk::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bd .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.bd .num{text-align:right;white-space:nowrap;min-width:170px}
.bd .num small{color:var(--muted)}

.ins{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ins li{padding:9px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--bg) 50%,var(--surface));border-left:3px solid var(--muted);font-size:14px}
.ins li.good{border-left-color:var(--win)}.ins li.bad{border-left-color:var(--loss)}

.disc{padding:0;overflow:hidden;margin-bottom:16px}
.disc-grid{display:grid;grid-template-columns:minmax(180px,.8fr) 2fr minmax(200px,1fr)}
.disc-grid > *{padding:16px 18px}
.disc-score{background:none;border:0;border-right:1px solid var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit}
.disc-score:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.disc-score .big{font-size:46px;font-weight:800;font-stretch:122%;line-height:1;letter-spacing:-.03em;margin:4px 0}
.disc-score .grade{font-size:18px;margin-left:8px;font-stretch:100%;letter-spacing:0}
.disc .k{font-size:12.5px;color:var(--muted)}.disc .s{font-size:12.5px;color:var(--muted)}
.disc .v{font-size:22px;font-weight:700;font-stretch:110%}
.disc-streaks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:center;border-right:1px solid var(--line)}
.disc-foot{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:4px;font-size:14px}
.acc{color:var(--accent)}
.recap{margin-bottom:16px;border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;opacity:.6}
.badge.on{opacity:1;border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 8%,transparent)}
.badge .bt{font-weight:700;margin-bottom:2px}
@media (max-width:820px){.disc-grid{grid-template-columns:1fr}.disc-score,.disc-streaks{border-right:0;border-bottom:1px solid var(--line)}.disc-streaks{grid-template-columns:repeat(3,minmax(0,1fr))}.disc .v{font-size:18px}}
.goal{padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--bg) 60%,var(--surface));overflow:hidden;margin:4px 0 2px}
.meter > i{display:block;height:100%;border-radius:4px}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.tbl td{padding:9px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tbl td.r,.tbl th.r{text-align:right}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.long{color:var(--win);border-color:color-mix(in srgb,var(--win) 40%,var(--line))}
.tag.short{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,var(--line))}

/* quick add */
.qa{display:grid;grid-template-columns:130px 92px 110px auto 70px 1fr 1fr 1fr 1fr 1.2fr auto;gap:8px;align-items:end}
.qa label.f{min-width:0}
.qa input,.qa select{width:100%}
.sidebtns{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;height:38px}
.sidebtns button{border:0;background:none;padding:0 12px;cursor:pointer;color:var(--muted);font-weight:600}
.sidebtns button.on.l{background:color-mix(in srgb,var(--win) 22%,transparent);color:var(--win)}
.sidebtns button.on.s{background:color-mix(in srgb,var(--loss) 22%,transparent);color:var(--loss)}
.preview{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}

/* drop zone */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);color:var(--text)}
.drop strong{color:var(--text);display:block;font-size:16px;margin-bottom:4px}

/* images */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:var(--bg);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;font-size:11.5px;background:color-mix(in srgb,var(--bg) 82%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .rm{position:absolute;top:4px;right:4px;background:color-mix(in srgb,var(--bg) 85%,transparent);border:0;border-radius:4px;color:var(--text);cursor:pointer;width:24px;height:24px}

/* journal */
.jgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.jlist{display:grid;gap:2px;max-height:72vh;overflow:auto}
.jlist button{display:flex;justify-content:space-between;gap:8px;background:none;border:0;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;color:var(--muted);font-size:14px;text-align:left}
.jlist button.on{background:var(--surface);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.jlist button:hover{color:var(--text)}
.mood{display:flex;gap:6px}
.mood button{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:none;cursor:pointer;font-size:19px}
.mood button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.check{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* modal */
.mbg{position:fixed;inset:0;background:color-mix(in srgb,#000 60%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:860px;padding:22px}
.modal.wide{max-width:1200px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fgrid .w2{grid-column:span 2}.fgrid .w4{grid-column:1/-1}
.lightimg{width:100%;max-height:70vh;object-fit:contain;background:var(--bg);border-radius:var(--r-sm)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-weight:600;font-size:14px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.err{background:var(--loss);color:#fff}

.empty{text-align:center;padding:56px 20px}
.empty h2{font-size:22px;font-stretch:115%}
.empty p{color:var(--muted);max-width:52ch;margin:0 auto 18px}
.stepper{display:grid;gap:10px;max-width:520px;margin:0 auto 20px;text-align:left;counter-reset:s;padding:0;list-style:none}
.stepper li{counter-increment:s;display:flex;gap:12px;align-items:center}
.stepper li::before{content:counter(s);width:26px;height:26px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.stepper li.done::before{content:"✓";background:var(--accent);color:var(--on-accent)}

.status{font-size:12px;padding:1px 8px;border-radius:999px}
.status.ok{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.status.warn{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.status.bad{background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--loss)}
.maprow{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;padding:4px 0}
.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.swatch{display:flex;align-items:center;gap:10px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.preset{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;background:none}
.preset span{width:14px;height:14px;border-radius:3px;display:inline-block}

@media (max-width:1100px){
  .qa{grid-template-columns:repeat(4,minmax(0,1fr))}
  .qa .qa-wide{grid-column:span 2}
  .split3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--bg);z-index:40;overflow-x:auto;gap:0}
  nav.side .brand,nav.side .side-foot,nav.side .install{display:none}
  nav.side button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-width:64px;align-items:center;text-align:center}
  nav.side button.on{box-shadow:inset 0 2px 0 var(--accent)}
  main{padding:18px 14px 110px}
  h1{font-size:24px}
  .split,.split3,.jgrid{grid-template-columns:1fr}
  .ledger{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ledger > div:nth-child(4n){border-right:1px solid var(--line)}
  .ledger > div:nth-child(2n){border-right:0}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mapgrid{grid-template-columns:1fr}
  .maprow{grid-template-columns:130px 1fr}
  .cal .d,.cal .wk{min-height:48px;font-size:10.5px;padding:3px}
  .cal .d b,.cal .wk b{font-size:11px}
  .bd .num{min-width:110px}
  .jlist{max-height:220px}
  .acct-tbl .hide-m{display:none}
  .acct-tbl td,.acct-tbl th{padding:8px 6px}
}

/* minimal pass */
.cal .d{background:transparent;border:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.cal .d.out{border-color:transparent}
.cal .wk{border:0;background:color-mix(in srgb,var(--bg) 35%,var(--surface))}
.goal{background:transparent;border:0;padding:0 0 4px}
.ins li{background:transparent;padding:6px 12px}
.panel{border:0;border-radius:14px;padding:20px}
.ledger{border:0;background:transparent;border-radius:0;gap:0}
.panel .ledger{margin:0 -4px}
.ledger > div{border:0!important;padding:12px 4px}
.ledger .v{font-size:20px}
.tblwrap{border:0;border-radius:0}
table.tbl{background:transparent}
.tbl th{background:var(--surface);font-weight:500}
.tbl td{border-bottom-color:color-mix(in srgb,var(--line) 45%,transparent)}
.motive{background:transparent;border:0;border-left:2px solid var(--accent);border-radius:0;padding:4px 0 4px 14px;grid-template-columns:1fr auto;margin:4px 0 20px}
.motive .bar{display:none}
.motive .msg{font-size:15px;font-weight:600}
.recap{border:0}
h2{font-size:15px;font-weight:600;color:var(--text)}
.btn{border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.filters{margin-bottom:20px}
.filters select{border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.stack{gap:20px}
.strip{display:grid;gap:12px}
.goalline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.meter.thin{height:4px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpis > div{display:grid;gap:2px}
.kpis .k{font-size:12.5px;color:var(--muted)}
.kpis b{font-size:22px;font-weight:700;font-stretch:112%;letter-spacing:-.01em}
.kpis .s{font-size:12.5px;color:var(--muted)}
.kpis .s.pos{color:var(--win)}.kpis .s.neg{color:var(--loss)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;cursor:pointer;justify-self:start;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--text)}
.disc2{grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:14px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.dscore{background:none;border:0;color:inherit;cursor:pointer;display:flex;align-items:baseline;gap:4px;padding:0}
.dscore b{font-size:36px;font-weight:800;font-stretch:120%;letter-spacing:-.03em;line-height:1}
.dscore span{font-size:15px;font-weight:700}
.hero{padding:20px 20px 8px}
.side-foot{opacity:.8}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{min-width:0}
  nav.side .nm{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .disc2{grid-template-columns:auto 1fr}
  .disc2 > .btn{grid-column:1/-1;justify-self:start}
  .panel{padding:16px}
  .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .filters .seg{grid-column:1/-1}
  .filters select{max-width:none;width:100%}
  .cal .d span:nth-child(2){display:none}
  .cal .d b{font-size:10px}
}
</style>
</head>
<body>

    <button data-view="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Trades</button>

    <button data-view="gallery" class="nm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Screenshots</button>
    <button data-view="import" class="nm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Import</button>
    <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
    <button id="install-btn" class="install" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Install app</button>
    <div class="side-foot" id="fs-status">Data stays in this browser. Back it up from Settings.</div>
  </nav>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<script>
"use strict";
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>ymd(new Date());
const toMin=t=>{if(!t)return null;const m=/^(\d{1,2}):(\d{2})/.exec(t);return m?(+m[1])*60+(+m[2]):null};
const num=v=>{
  if(v===null||v===undefined)return null;
  let s=String(v).trim();if(s==='')return null;
  s=s.replace(/[$£€\s,]/g,'');let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.startsWith('-')){neg=!neg;s=s.slice(1)}
  const n=parseFloat(s);return isNaN(n)?null:(neg?-n:n);
};
const cur=()=>S.settings.currency||'$';
const money=(n,sign=true)=>{
  if(n==null||!isFinite(n))return '–';
  const a=Math.abs(n);
  const s=a>=1000000?a.toLocaleString(undefined,{maximumFractionDigits:0}):a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'−':(sign&&n>0?'+':''))+cur()+s;
};
const moneyShort=n=>{const a=Math.abs(n);const s=a>=1e6?(a/1e6).toFixed(1)+'m':a>=1e3?(a/1e3).toFixed(a>=1e4?0:1)+'k':a.toFixed(0);return (n<0?'−':'')+cur()+s};
const pct=n=>n==null||!isFinite(n)?'–':(n*100).toFixed(1)+'%';
const fx=(n,d=2)=>n==null||!isFinite(n)?'–':(Math.abs(n)<0.5*Math.pow(10,-d)?0:n).toFixed(d);
const cls=n=>n>0?'pos':n<0?'neg':'';
const dt=t=>t.date+' '+(t.time||'00:00');
const byDT=(a,b)=>dt(a)<dt(b)?-1:dt(a)>dt(b)?1:0;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dowOf=d=>new Date(d+'T12:00:00').getDay();
const fmtDate=d=>{if(!d)return '';const x=new Date(d+'T12:00:00');return x.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const fmtDateShort=d=>{const x=new Date(d+'T12:00:00');return x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};

function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),kind==='err'?4200:2200)}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ================= storage (IndexedDB) ================= */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ledger-journal',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('images'))d.createObjectStore('images',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r&&'onsuccess' in r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const imgPut=o=>tx('images','readwrite',s=>s.put(o)).then(r=>{bumpRev();scheduleSync(true);return r});
const imgDel=id=>tx('images','readwrite',s=>s.delete(id)).then(r=>{bumpRev();scheduleSync(true);return r});
const imgAll=()=>tx('images','readonly',s=>s.getAll());
const imgClear=()=>tx('images','readwrite',s=>s.clear());

/* ================= state ================= */
const THEMES={
  Harbour:{bg:'#0E1B26',surface:'#152635',line:'#22384A',text:'#E4ECF1',muted:'#8EA3B3',accent:'#E3A43C',win:'#35B98A',loss:'#E5605A'},
  Graphite:{bg:'#18191C',surface:'#212327',line:'#33363C',text:'#ECECEE',muted:'#9A9DA4',accent:'#7AA7FF',win:'#4CC38A',loss:'#F06A6A'},
  Oxblood:{bg:'#1C1416',surface:'#261B1E',line:'#3A2A2E',text:'#F1E7E4',muted:'#B09A97',accent:'#D9A35F',win:'#6CC497',loss:'#E86A5E'},
  Daylight:{bg:'#EEF1F4',surface:'#FFFFFF',line:'#D8DEE5',text:'#16202A',muted:'#5E6B78',accent:'#2457D6',win:'#12865A',loss:'#C93A32'},
};
const DEFAULT_SETTINGS={
  theme:{...THEMES.Harbour},
  currency:'$',
  dateOrder:'auto',
  setups:['Sweep + FVG','Sweep + OB','OTE retrace','BOS continuation'],
  mistakes:['FOMO entry','Moved stop','Oversized','Outside kill zone','Revenge trade','Early exit','No HTF bias'],
  rules:['Traded only in my kill zones','HTF bias marked before the open','Risk per trade within my limit','Stopped after daily max loss'],
  sessions:[{name:'Asia',start:'00:00',end:'06:00'},{name:'London',start:'07:00',end:'10:00'},{name:'New York',start:'12:00',end:'15:00'}],
  motivation:{enabled:true,lossStreak:2,redDays:2,ddMin:0,ddBase:'start',rule:'Half size. A+ setups only. Stop after two losses.',custom:[]},
  ror:{ruin:null,target:null,unit:'trade'},
  game:{enabled:true,maxTrades:3,maxLoss:null,sizeTol:1.5},
  goal:{amount:1000000,metric:'capital'},
};
const S={trades:[],instruments:[],accounts:[],journal:{},settings:null,mappings:{},imports:[],images:[],weekly:{},
  view:'dashboard',filter:{range:'all',from:'',to:'',account:'',symbol:'',setup:'',market:''},
  cal:null,jDate:null,gFilter:'all',tradeLimit:100,selected:new Set(),imp:null,motiveHidden:''};
const KEYS=['trades','instruments','accounts','journal','settings','mappings','imports','weekly'];
const saveTimers={};
function bumpRev(){S.rev=(S.rev||0)+1;kvSet('rev',S.rev).catch(()=>{})}
function save(k){bumpRev();clearTimeout(saveTimers[k]);saveTimers[k]=setTimeout(()=>{kvSet(k,S[k]).catch(e=>toast('Could not save: '+e.message,'err'));scheduleSync()},120)}
function mergeDefaults(s){const o=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));if(!s)return o;
  for(const k in s){if(k==='theme'||k==='motivation'||k==='ror'||k==='game'||k==='goal')o[k]={...o[k],...s[k]};else o[k]=s[k]}return o}

/* ================= theme ================= */
function lum(hex){const h=hex.replace('#','');const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function applyTheme(){const t=S.settings.theme;const r=document.documentElement.style;
  for(const k in t)r.setProperty('--'+k,t[k]);
  r.setProperty('--on-accent',lum(t.accent)>.45?'#111':'#fff');
  document.documentElement.style.colorScheme=lum(t.bg)>.5?'light':'dark';
  const m=$('meta[name=theme-color]');if(m)m.content=t.bg}

/* ================= instruments ================= */
const PRESETS=[
  ['NQ','E-mini Nasdaq-100',0.25,5],['MNQ','Micro E-mini Nasdaq-100',0.25,0.5],
  ['ES','E-mini S&P 500',0.25,12.5],['MES','Micro E-mini S&P 500',0.25,1.25],
  ['YM','E-mini Dow',1,5],['MYM','Micro E-mini Dow',1,0.5],
  ['RTY','E-mini Russell 2000',0.1,5],['M2K','Micro E-mini Russell 2000',0.1,0.5],
  ['GC','Gold',0.1,10],['MGC','Micro Gold',0.1,1],
  ['CL','Crude Oil',0.01,10],['MCL','Micro Crude Oil',0.01,1],
  ['6B','British Pound',0.0001,6.25],['6E','Euro FX',0.00005,6.25],['M6E','Micro Euro FX',0.0001,1.25],
  ['ZN','10-Year T-Note',0.015625,15.625],
];
const CFD_PRESETS=[
  ['NAS100','Nasdaq 100',1,1,'US100,USTEC,NDX100,NAS'],['US30','Dow Jones',1,1,'DJ30,WS30,DOW30'],['US500','S&P 500',1,1,'SPX500,SP500'],
  ['GER40','DAX 40',1,1.08,'DE40,DAX40,GER30'],['XAUUSD','Gold',100,1,'GOLD'],['XAGUSD','Silver',5000,1,'SILVER'],
  ['GBPUSD','GBP/USD',100000,1,''],['EURUSD','EUR/USD',100000,1,''],['GBPJPY','GBP/JPY',100000,0.0067,''],['USDJPY','USD/JPY',100000,0.0067,''],
  ['USOIL','WTI crude oil',100,1,'WTI,XTIUSD,USOUSD'],
];
const instOf=sym=>S.instruments.find(i=>i.sym===sym);
const isCfd=i=>i&&i.type==='cfd';
const pointValue=i=>!i?0:isCfd(i)?(+i.contractSize||0)*(+i.fx||1):(i.tickSize>0?i.tickValue/i.tickSize:0);
const unitWord=(i,n)=>isCfd(i)?(n===1?'lot':'lots'):(n===1?'contract':'contracts');
const qtyFmt=t=>{const i=instOf(t.symbol);return isCfd(i)?`${(+t.qty).toFixed(2)} lots`:`${t.qty} ct`};
function matchInst(raw,list){
  if(!raw)return null;const toks=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,' ').split(/\s+/).filter(Boolean);
  const c=[];for(const i of list){c.push([i.sym.toUpperCase(),i]);String(i.aliases||'').split(',').map(a=>a.trim().toUpperCase().replace(/[^A-Z0-9]/g,'')).filter(Boolean).forEach(a=>c.push([a,i]))}
  c.sort((a,b)=>b[0].length-a[0].length);
  for(const tok of toks)for(const [s,i] of c){if(tok===s)return i.sym;if(tok.startsWith(s)){const rest=tok.slice(s.length);
    if(!isCfd(i)&&/^[FGHJKMNQUVXZ]\d{1,4}$/.test(rest))return i.sym;if(isCfd(i)&&/^[A-Z]{1,4}$/.test(rest))return i.sym}}
  return null}
const presetObjs=()=>[...PRESETS.map(p=>({sym:p[0],type:'future'})),...CFD_PRESETS.map(p=>({sym:p[0],aliases:p[4],type:'cfd'}))];
function matchSymbol(raw){
  if(!raw)return null;const syms=S.instruments.map(i=>i.sym).sort((a,b)=>b.length-a.length);
  const up=String(raw).toUpperCase();
  const tokens=up.replace(/[^A-Z0-9]/g,' ').split(/\s+/).filter(Boolean);
  for(const tok of tokens)for(const s of syms){if(tok===s)return s;if(tok.startsWith(s)&&/^[FGHJKMNQUVXZ]\d{1,4}$/.test(tok.slice(s.length)))return s}
  const flat=up.replace(/[^A-Z0-9]/g,'');
  for(const s of syms)if(flat.startsWith(s))return s;
  return null;
}

/* ================= trade math ================= */
function sessionFor(time){const m=toMin(time);if(m==null)return '';
  for(const s of S.settings.sessions){const a=toMin(s.start),b=toMin(s.end);if(a==null||b==null)continue;if(a<=b?(m>=a&&m<b):(m>=a||m<b))return s.name}
  return 'Outside sessions'}
function computeTrade(t){
  const i=instOf(t.symbol);const q=Math.abs(+t.qty||0);const pv=pointValue(i);
  const dir=t.side==='Short'?-1:1;
  let gross=0;
  if(t.grossManual!=null&&t.grossManual!=='')gross=+t.grossManual;
  else if(t.entry!=null&&t.exit!=null&&pv)gross=(t.exit-t.entry)*dir*q*pv;
  if(t.swap!=null&&t.swap!=='')gross+=+t.swap;
  t.market=i?(i.type||'future'):'unknown';
  const fees=(t.fees!=null&&t.fees!=='')?+t.fees:(i?(+i.commission||0)*2*q:0);
  t.gross=round2(gross);t.feesR=round2(fees);t.pnl=round2(gross-fees);
  let risk=null;
  if(t.riskManual!=null&&t.riskManual!=='')risk=Math.abs(+t.riskManual);
  else if(t.stop!=null&&t.entry!=null&&pv)risk=Math.abs(t.entry-t.stop)*q*pv;
  t.risk=risk&&risk>0?round2(risk):null;
  t.r=t.risk?t.pnl/t.risk:null;
  t.session=sessionFor(t.time);
  t.hold=null;
  if(t.time&&t.exitTime){let a=toMin(t.time),b=toMin(t.exitTime);if(a!=null&&b!=null){if(b<a)b+=1440;t.hold=b-a}}
  t.known=!!i;
  return t;
}
const round2=n=>Math.round(n*100)/100;
function recomputeAll(){S.trades.forEach(computeTrade)}

/* ================= analytics ================= */
function analyze(list,base){
  const ts=[...list].sort(byDT);const eq0=base?.eq0||0,pk0=base?.peak0!=null?Math.max(base.peak0,eq0):eq0;
  const A={n:ts.length,net:0,gw:0,gl:0,w:0,l:0,be:0,fees:0,curve:[],maxDD:0,curDD:0,peak:0,largestW:0,largestL:0,
    maxWS:0,maxLS:0,curStreak:0,maxWDS:0,maxLDS:0,curDayStreak:0,rSum:0,rN:0,holdW:[],holdL:[],days:[],ts};
  let eq=eq0,peak=pk0,ws=0,ls=0;A.eq0=eq0;A.peak0=pk0;A.maxDD=pk0-eq0;
  for(const t of ts){const p=t.pnl||0;eq+=p;A.net+=p;A.fees+=t.feesR||0;
    if(p>0){A.w++;A.gw+=p;ws++;ls=0;A.largestW=Math.max(A.largestW,p);if(t.hold!=null)A.holdW.push(t.hold)}
    else if(p<0){A.l++;A.gl+=p;ls++;ws=0;A.largestL=Math.min(A.largestL,p);if(t.hold!=null)A.holdL.push(t.hold)}
    else A.be++;
    A.maxWS=Math.max(A.maxWS,ws);A.maxLS=Math.max(A.maxLS,ls);
    peak=Math.max(peak,eq);const dd=peak-eq;A.maxDD=Math.max(A.maxDD,dd);
    if(t.r!=null){A.rSum+=t.r;A.rN++}
    A.curve.push({eq,dd,t});
  }
  A.peak=peak;A.curDD=peak-eq;A.endEq=eq;A.based=!!base?.on;A.curStreak=ws>0?ws:-ls;
  const dm=new Map();
  for(const t of ts){const d=dm.get(t.date)||{date:t.date,pnl:0,n:0,w:0,l:0};d.pnl+=t.pnl;d.n++;if(t.pnl>0)d.w++;else if(t.pnl<0)d.l++;dm.set(t.date,d)}
  A.days=[...dm.values()].sort((a,b)=>a.date<b.date?-1:1);
  let dws=0,dls=0;
  for(const d of A.days){d.pnl=round2(d.pnl);if(d.pnl>0){dws++;dls=0}else if(d.pnl<0){dls++;dws=0}A.maxWDS=Math.max(A.maxWDS,dws);A.maxLDS=Math.max(A.maxLDS,dls)}
  A.curDayStreak=dws>0?dws:-dls;
  const green=A.days.filter(d=>d.pnl>0),red=A.days.filter(d=>d.pnl<0);
  A.greenDays=green.length;A.redDays=red.length;
  A.bestDay=A.days.length?A.days.reduce((a,b)=>b.pnl>a.pnl?b:a):null;
  A.worstDay=A.days.length?A.days.reduce((a,b)=>b.pnl<a.pnl?b:a):null;
  A.avgGreenDay=green.length?green.reduce((s,d)=>s+d.pnl,0)/green.length:null;
  A.avgRedDay=red.length?red.reduce((s,d)=>s+d.pnl,0)/red.length:null;
  A.winRate=A.w+A.l?A.w/(A.w+A.l):null;

const fmtHold=m=>m==null?'–':m<60?Math.round(m)+'m':Math.floor(m/60)+'h '+Math.round(m%60)+'m';

function insights(ts,A){
  const out=[];if(ts.length<5)return out;const MIN=5;
  const setups=groupBy(ts,t=>t.setup).filter(g=>g.n>=MIN).sort((a,b)=>b.exp-a.exp);
  if(setups.length>=2){const b=setups[0],w=setups[setups.length-1];
    out.push({tone:'good',text:`Best setup: ${b.key}, ${money(b.exp)} per trade over ${b.n} trades (${pct(b.wr)} win rate).`});
    if(w.exp<0)out.push({tone:'bad',text:`${w.key} is losing money: ${money(w.net)} over ${w.n} trades. Cut it or fix it.`})}
  const hrs=groupBy(ts,t=>t.time?t.time.slice(0,2)+':00':null).filter(g=>g.n>=MIN).sort((a,b)=>a.net-b.net);
  if(hrs.length>=2&&hrs[0].net<0)out.push({tone:'bad',text:`Worst hour: ${hrs[0].key}, ${money(hrs[0].net)} across ${hrs[0].n} trades.`});
  const ctx=dayContext(ts);
  const after=ts.filter(t=>ctx.get(t.id)?.afterLoss);
  if(after.length>=MIN){const g=analyze(after);
    if(A.winRate!=null&&g.winRate!=null&&g.winRate<A.winRate-.08)out.push({tone:'bad',text:`After a losing trade, your win rate drops to ${pct(g.winRate)} (overall ${pct(A.winRate)}). Those trades netted ${money(g.net)}.`});
    else out.push({tone:'note',text:`Trades taken after a loss the same day: ${pct(g.winRate)} win rate, ${money(g.net)} net.`})}
  const late=ts.filter(t=>(ctx.get(t.id)?.idx||1)>=4);
  if(late.length>=MIN){const g=analyze(late);if(g.net<0)out.push({tone:'bad',text:`Your 4th+ trade of the day has cost ${money(g.net)} over ${g.n} trades. Consider a 3-trade cap.`})}
  const L=ts.filter(t=>t.side==='Long'),Sh=ts.filter(t=>t.side==='Short');
  if(L.length>=MIN&&Sh.length>=MIN){const a=analyze(L),b=analyze(Sh);const better=a.exp>b.exp?['Longs',a,'shorts',b]:['Shorts',b,'longs',a];
    out.push({tone:'note',text:`${better[0]} pay better: ${money(better[1].exp)} per trade vs ${money(better[3].exp)} for ${better[2]}.`})}
  if(A.avgHoldW!=null&&A.avgHoldL!=null&&A.holdW.length>=MIN&&A.holdL.length>=MIN&&A.avgHoldL>A.avgHoldW*1.5)
    out.push({tone:'bad',text:`You hold losers ${fmtHold(A.avgHoldL)} on average vs winners ${fmtHold(A.avgHoldW)}. Losers are getting extra rope.`});
  // rule adherence vs P&L
  const fullDays=[],brokeDays=[];
  for(const d of A.days){const j=S.journal[d.date];if(!j||!j.rules)continue;const rules=S.settings.rules;if(!rules.length)continue;
    const ok=rules.every(r=>j.rules[r]);(ok?fullDays:brokeDays).push(d.pnl)}
  if(fullDays.length>=3&&brokeDays.length>=3){const a=fullDays.reduce((s,x)=>s+x,0)/fullDays.length,b=brokeDays.reduce((s,x)=>s+x,0)/brokeDays.length;
    out.push({tone:a>b?'good':'note',text:`Days you followed every rule average ${money(a)}. Days you broke one average ${money(b)}.`})}
  if(A.consistency!=null&&A.consistency>.4)out.push({tone:'bad',text:`Your best day is ${pct(A.consistency)} of total profit. Many prop firms cap this (often 30–50%). Check your firm's consistency rule.`});
  if(A.n<30)out.push({tone:'note',text:`Only ${A.n} trades in this view. Treat patterns as hints until you have 30+.`});
  return out;
}

  let eq=0,peak=0,on=false;for(const a of accs){if(a.prior!=null&&a.prior!==''){on=true}const P=acctPrior(a);eq+=P.prior;peak+=P.peakBal-P.start}

const MESSAGES=[

function motivation(){
  const m=S.settings.motivation;if(!m.enabled||!S.trades.length||S.motiveHidden===todayStr())return '';
  const A=analyze(S.trades,baseFor({range:'all'}));const rd=A.curDayStreak<0?-A.curDayStreak:0;const why=[];
  const seen=new Map();for(const t of [...S.trades].sort(byDT)){const k=t.time?`${t.date}|${t.time}|${t.symbol}|${t.side}`:t.id;const p=seen.get(k);seen.set(k,(p||0)+t.pnl)}
  let ls=0;for(const v of seen.values()){if(v<0)ls++;else if(v>0)ls=0}
  if(m.lossStreak>0&&ls>=m.lossStreak)why.push(`${ls} losing trades in a row`);
  if(m.redDays>0&&rd>=m.redDays)why.push(`${rd} red days in a row`);
  const ddOn=m.ddBase==='peak'?A.curDD>0:A.endEq<0;
  if(ddOn&&A.curDD>=(+m.ddMin||0))why.push(m.ddBase==='peak'?`${money(-A.curDD)} below your equity peak`:`${money(A.endEq)} overall`);

}

function calendarHTML(A){

/* ================= risk of ruin ================= */
function acctPrior(a){const start=+a.start||0,prior=+a.prior||0;const peakBal=a.peakBal!=null&&a.peakBal!==''?+a.peakBal:start+Math.max(prior,0);return{start,prior,peakBal:Math.max(peakBal,start+prior)}}

const urlCache=new Map();
function imgURL(im){if(!urlCache.has(im.id))urlCache.set(im.id,URL.createObjectURL(im.blob));return urlCache.get(im.id)}
async function prepImage(file){
  try{const bmp=await createImageBitmap(file);const max=2400;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
    const b=await new Promise(r=>c.toBlob(r,'image/webp',.88));if(b&&b.size<file.size)return b}catch(e){}
  return file}
async function addImages(files,{tradeId=null,date=todayStr(),auto=false}={}){
  const out=[];for(const f of files){if(!f||!f.type||!f.type.startsWith('image/'))continue;
    let tid=tradeId,dt=date;if(auto&&!tid){const L=autoLinkShot(f.name);if(L){dt=L.date;tid=L.tradeId}}
    const blob=await prepImage(f);const o={id:uid(),tradeId:tid,date:dt,caption:'',created:Date.now(),blob};
    try{await imgPut(o);S.images.push(o);out.push(o)}catch(e){toast('Could not save image: '+e.message,'err')}}
  if(out.length)toast(`${out.length} screenshot${out.length>1?'s':''} saved`);return out}
function bindDrop(zone,input,cb){if(!zone)return;
  zone.onclick=()=>input.click();input.onchange=()=>{cb([...input.files]);input.value=''};
  zone.ondragover=e=>{e.preventDefault();zone.classList.add('over')};zone.ondragleave=()=>zone.classList.remove('over');
  zone.ondrop=e=>{e.preventDefault();e.stopPropagation();zone.classList.remove('over');cb([...e.dataTransfer.files])}}
function renderThumbs(sel,list,removable=true){const el=$(sel);if(!el)return;
  el.innerHTML=list.sort((a,b)=>b.created-a.created).map(im=>{const t=im.tradeId?S.trades.find(x=>x.id===im.tradeId):null;
    const cap=im.caption||(t?`${t.symbol} ${t.side} ${money(t.pnl)}`:fmtDate(im.date));
    return `<div class="thumb" data-img="${im.id}"><img src="${imgURL(im)}" alt="${esc(cap)}" loading="lazy"><span class="cap">${esc(cap)}</span>${removable?`<button class="rm" data-rm="${im.id}" aria-label="Delete screenshot" title="Delete">×</button>`:''}</div>`}).join('');
  $$('[data-img]',el).forEach(d=>d.onclick=e=>{if(e.target.closest('[data-rm]'))return;openImage(d.dataset.img,sel,list)});
  $$('[data-rm]',el).forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm('Delete this screenshot?'))return;await deleteImage(b.dataset.rm);
    const keep=list.filter(i=>i.id!==b.dataset.rm);renderThumbs(sel,keep,removable)})}
async function deleteImage(id){await imgDel(id);S.images=S.images.filter(i=>i.id!==id);if(urlCache.has(id)){URL.revokeObjectURL(urlCache.get(id));urlCache.delete(id)}}
function openImage(id){
  const im=S.images.find(i=>i.id===id);if(!im)return;const inModal=!!modalCtx;
  if(inModal){window.open(imgURL(im),'_blank');return}
  const sameDay=S.trades.filter(t=>t.date===im.date).sort(byDT);
  showModal(`<div class="mhead"><h2 style="margin:0">${esc(fmtDate(im.date))}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
   <img class="lightimg" src="${imgURL(im)}" alt="">
   <div class="fgrid" style="margin-top:12px"><label class="f w2">Caption<input id="li-cap" value="${esc(im.caption)}"></label><label class="f">Date<input type="date" id="li-date" value="${esc(im.date)}"></label>
   <label class="f">Linked trade<select id="li-trade"><option value="">Not linked</option>${sameDay.map(t=>`<option value="${t.id}" ${t.id===im.tradeId?'selected':''}>${esc((t.time||'')+' '+t.symbol+' '+t.side+' '+money(t.pnl))}</option>`).join('')}</select></label></div>

function parseDT(v,order){

function parseTime(v){const m=/(\d{1,2}):(\d{2})(?::\d{2})?(?:\.\d+)?\s*(AM|PM)?/i.exec(String(v||''));if(!m)return '';let hh=+m[1];if(m[3]){if(/pm/i.test(m[3])&&hh<12)hh+=12;if(/am/i.test(m[3])&&hh===12)hh=0}return pad2(hh)+':'+m[2]}
function detectOrder(vals){let d=0,mm=0;for(const v of vals){const x=/^\s*(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(String(v||''));if(!x)continue;if(+x[1]>12)d++;else if(+x[2]>12)mm++}return d>mm?'dmy':'mdy'}

function impBuild(){

const TS_RE=/(\d{4}-\d{2}-\d{2})T(\d{2})[_:](\d{2})[_:](\d{2})(?:\.(\d+))?Z/;

function tms(s){const m=/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(String(s||''));

  const d=parseDT(s,'mdy');if(!d)return null;const sec=/:\d{2}:(\d{2})/.exec(String(s));const[h,mi]=(d.time||'00:00').split(':');

const NRE=/^(.*?)\s+order\s+(placed|modified|partially executed|executed|filled|cancell?ed|rejected)\s+on\s+(\S+)\s+\((\d+)\)/i;

/* ================= backup ================= */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function backup(){toast('Preparing backup…');
  const images=[];for(const im of S.images){images.push({id:im.id,tradeId:im.tradeId,date:im.date,caption:im.caption,created:im.created,data:await blobToDataURL(im.blob)})}
  const out={app:'ledger-journal',version:1,exported:new Date().toISOString(),images};KEYS.forEach(k=>out[k]=S[k]);
  download(`ledger-backup-${todayStr()}.json`,JSON.stringify(out),'application/json')}
async function restore(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast('That file is not a valid backup','err');return}
  if(d.app!=='ledger-journal'){toast('That file is not a Ledger backup','err');return}
  if(!confirm(`Replace everything here with this backup (${(d.trades||[]).length} trades, ${(d.images||[]).length} screenshots)?`))return;
  const old=new Map(S.images.map(i=>[i.id,i.blob]));
  const missing=await applyData(d,async im=>im.data?await (await fetch(im.data)).blob():old.get(im.id)||null);
  scheduleSync(true);toast(missing?`Backup restored. ${missing} screenshots weren't in it.`:'Backup restored');render()}
function exportCSV(){
  const cols=['date','time','exitTime','symbol','side','qty','entry','exit','stop','gross','feesR','pnl','r','setup','account','session','rating','mistakes','notes'];
  const q=v=>{const s=Array.isArray(v)?v.join('; '):String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[cols.join(',')].concat([...S.trades].sort(byDT).map(t=>cols.map(c=>q(c==='r'&&t.r!=null?t.r.toFixed(2):t[c])).join(',')));
  download(`ledger-trades-${todayStr()}.csv`,lines.join('\n'),'text/csv')}


/* ================= auto-save folder ================= */
const FS={dir:null,state:'off',last:null,timer:null,busy:false,again:false,full:false,err:'',pending:null};
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const fsSupported=()=>'showDirectoryPicker' in window;
const extOf=b=>({'image/webp':'webp','image/png':'png','image/jpeg':'jpg','image/gif':'gif'})[b&&b.type]||'img';
const imgFile=i=>i.id+'.'+extOf(i.blob);
function snapshot(){const o={app:'ledger-journal',version:2,rev:S.rev||0,savedAt:new Date().toISOString()};KEYS.forEach(k=>o[k]=S[k]);
  o.images=S.images.map(i=>({id:i.id,tradeId:i.tradeId,date:i.date,caption:i.caption,created:i.created,file:'images/'+imgFile(i)}));return o}
async function fsWrite(dir,name,data){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(data);await w.close()}
async function fsCheck(){if(!FS.dir){FS.state='off';return false}
  try{const p=await FS.dir.queryPermission({mode:'readwrite'});FS.state=p==='granted'?'on':'paused'}catch(e){FS.state='paused'}return FS.state==='on'}
function scheduleSync(full){if(FS.state!=='on')return;if(full)FS.full=true;clearTimeout(FS.timer);FS.timer=setTimeout(()=>{FS.timer=null;syncNow()},1500)}
async function syncImages(){const idir=await FS.dir.getDirectoryHandle('images',{create:true});const have=new Set();
  for await(const name of idir.keys())have.add(name);
  const want=new Set(S.images.map(imgFile));
  for(const im of S.images){const n=imgFile(im);if(!have.has(n))await fsWrite(idir,n,im.blob)}
  for(const n of have)if(!want.has(n))await idir.removeEntry(n).catch(()=>{})}
async function pruneBackups(bdir){const names=[];for await(const n of bdir.keys())if(/^ledger-\d{4}-\d{2}-\d{2}\.json$/.test(n))names.push(n);
  names.sort().reverse().slice(30).forEach(n=>bdir.removeEntry(n).catch(()=>{}))}
async function syncNow(full){
  if(FS.state!=='on')return;if(FS.busy){FS.again=true;if(full)FS.full=true;return}
  FS.busy=true;const doImgs=full||FS.full;FS.full=false;
  try{const snap=JSON.stringify(snapshot(),null,1);
    await fsWrite(FS.dir,'ledger-data.json',snap);
    const bdir=await FS.dir.getDirectoryHandle('daily-backups',{create:true});await fsWrite(bdir,`ledger-${todayStr()}.json`,snap);
    if(doImgs)await syncImages();await pruneBackups(bdir);FS.last=new Date();FS.err=''}
  catch(e){FS.err=e.message||String(e);if(e.name==='NotAllowedError'||e.name==='SecurityError')FS.state='paused';
    else if(e.name==='NotFoundError'){FS.state='paused';FS.err='The folder was moved or deleted. Choose it again.'}}
  FS.busy=false;updateFsStatus();if(FS.again){FS.again=false;syncNow()}}
function fsLabel(){
  if(!fsSupported())return 'Data is in this browser only. Back it up from Settings.';
  if(FS.state==='on')return `Auto-saving to “${esc(FS.dir.name)}”${FS.last?`, last ${FS.last.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`:''}${FS.err?`<br><span class="neg">${esc(FS.err)}</span>`:''}`;
  if(FS.state==='paused')return `<span style="color:var(--accent)">Folder saving paused.</span> <a href="#" data-act="fs-reconnect">Reconnect</a>`;
  if(FS.state==='behind')return `<span style="color:var(--accent)">Folder has newer data.</span> <a href="#" data-act="fs-resolve">Choose</a>`;
  return 'Only saved in this browser. <a href="#" data-act="fs-choose">Save to a folder</a>'}
function updateFsStatus(){const e=$('#fs-status');if(e)e.innerHTML=fsLabel();const p=$('#fs-panel-status');if(p)p.innerHTML=fsLabel()}
function nudgeBanner(){return `<div class="motive"><span class="bar"></span><div><div class="msg" style="font-size:15px">Keep your journal on this computer</div><div class="ctx">Right now it only lives in this browser, so clearing browser data would wipe it. Pick a place once (Documents is fine) and Ledger makes a “${FOLDER_NAME}” folder and saves every change there.</div></div><div class="row"><button class="btn sm" data-act="fs-later">Not now</button><button class="btn sm pri" data-act="fs-choose">Create journal folder</button></div></div>`}
function behindBanner(){const d=FS.pending?.data||{};return `<div class="motive"><span class="bar"></span><div><div class="msg" style="font-size:15px">Your journal folder has newer data</div><div class="ctx">It has ${plural((d.trades||[]).length,'trade')}, this browser has ${S.trades.length}. Probably saved from another computer. Nothing is written to the folder until you choose.</div></div><button class="btn sm pri" data-act="fs-resolve">Choose</button></div>`}
function fsBanner(){return `<div class="motive"><span class="bar"></span><div><div class="msg" style="font-size:15px">Auto-save is paused</div><div class="ctx">Your browser needs your OK again before it can write to “${esc(FS.dir?.name||'your folder')}”. Changes are still saved in the browser meanwhile.</div></div><button class="btn sm pri" data-act="fs-reconnect">Reconnect</button></div>`}
const FOLDER_NAME='Ledger Journal';
async function readJournal(dir){try{const fh=await dir.getFileHandle('ledger-data.json');const d=JSON.parse(await (await fh.getFile()).text());return d&&d.app==='ledger-journal'?d:null}catch(e){return null}}
async function writeReadme(dir){try{await dir.getFileHandle('READ ME.txt')}catch(e){try{await fsWrite(dir,'READ ME.txt',
`This folder is your Ledger trading journal. Ledger writes to it automatically.

ledger-data.json   your trades, journal and settings (the live copy)
images/            your screenshots
daily-backups/     one copy per day, last 30 days

Don't edit these files by hand.
New computer: open Ledger, Settings > Keep your journal on this computer,
choose this folder, then pick "Load the folder's journal".
Roll back a bad day: Settings > Restore from backup > pick a file in daily-backups.
`)}catch(e){}}}
async function fsChoose(){
  if(!fsSupported()){toast('Saving to a folder needs Chrome or Edge on a computer','err');return}
  let dir;try{dir=await window.showDirectoryPicker({id:'ledger-journal',mode:'readwrite',startIn:'documents'})}catch(e){return}
  let existing=await readJournal(dir);
  if(!existing){let sub=null;try{sub=await dir.getDirectoryHandle(FOLDER_NAME)}catch(e){}
    if(sub){dir=sub;existing=await readJournal(sub)}
    else if(dir.name!==FOLDER_NAME){try{dir=await dir.getDirectoryHandle(FOLDER_NAME,{create:true})}catch(e){toast('Could not create the folder there. Pick another location.','err');return}}}
  if(existing){FS.pending={dir,data:existing};conflictModal(existing,'This folder already has a journal');return}
  await fsConnect(dir);await writeReadme(dir);await syncNow(true);toast(`Saving to “${dir.name}”. Your journal now lives on this computer.`);render(true)}
function conflictModal(existing,title){
  showModal(`<div class="mhead"><h2 style="margin:0">${esc(title)}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
     <p>The folder holds <b>${plural((existing.trades||[]).length,'trade')}</b> and <b>${plural((existing.images||[]).length,'screenshot')}</b>, last saved ${esc(new Date(existing.savedAt).toLocaleString())}.</p>
     <p>This browser has <b>${plural(S.trades.length,'trade')}</b> and <b>${plural(S.images.length,'screenshot')}</b>.</p>
     <p class="muted small">Either way, the folder's daily-backups stay as they are until the next save, so you can roll back.</p>
     <div class="row" style="margin-top:14px"><button class="btn" data-act="close">Decide later</button><span class="spacer"></span><button class="btn ${S.trades.length<(existing.trades||[]).length?'danger':''}" data-act="fs-overwrite">Keep this browser's data</button><button class="btn pri" data-act="fs-load">Load the folder's journal</button></div>`)}
async function fsStart(){ // launch or reconnect: never overwrite a newer folder copy
  const d=await readJournal(FS.dir);
  if(d&&((d.rev||0)>(S.rev||0)||(d.trades||[]).length>S.trades.length)){FS.state='behind';FS.pending={dir:FS.dir,data:d};updateFsStatus();return false}
  await writeReadme(FS.dir);await syncNow(true);return true}
async function fsConnect(dir){FS.dir=dir;FS.state='on';FS.err='';await kvSet('dirHandle',dir)}
async function applyData(d,blobFor){
  for(const k of KEYS){S[k]=k==='settings'?mergeDefaults(d.settings):(d[k]??(Array.isArray(S[k])?[]:{}));await kvSet(k,S[k])}
  await imgClear();urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear();S.images=[];let missing=0;
  for(const im of d.images||[]){let blob=null;try{blob=await blobFor(im)}catch(e){}if(!blob){missing++;continue}
    const o={id:im.id,tradeId:im.tradeId,date:im.date,caption:im.caption||'',created:im.created||Date.now(),blob};await tx('images','readwrite',s=>s.put(o));S.images.push(o)}
  recomputeAll();applyTheme();return missing}
async function fsLoad(){const{dir,data}=FS.pending||{};if(!dir)return;FS.pending=null;closeModal();toast('Loading journal from folder…');
  const idir=await dir.getDirectoryHandle('images',{create:true});
  const missing=await applyData(data,async im=>{const name=(im.file||'').replace(/^images\//,'');return await (await idir.getFileHandle(name)).getFile()});
  S.rev=Math.max(S.rev||0,data.rev||0);await kvSet('rev',S.rev);
  await fsConnect(dir);await syncNow(true);toast(missing?`Loaded. ${missing} screenshot files were missing.`:'Journal loaded. Saving to the folder again');render()}
async function fsOverwrite(){const{dir,data}=FS.pending||{};if(!dir)return;if(S.trades.length<(data.trades||[]).length&&!confirm(`This browser has fewer trades than the folder. Overwrite the folder anyway? Yesterday's copy in daily-backups is kept.`))return;FS.pending=null;closeModal();S.rev=Math.max(S.rev||0,data?.rev||0)+1;await kvSet('rev',S.rev);await fsConnect(dir);await writeReadme(dir);await syncNow(true);toast('Saving to your folder');render(true)}
async function fsReconnect(){if(!FS.dir){fsChoose();return}
  try{const p=await FS.dir.requestPermission({mode:'readwrite'});if(p==='granted'){FS.state='on';if(await fsStart())toast('Saving to your folder again');render(true)}else toast('Permission was not given','err')}
  catch(e){toast('Could not reconnect. Choose the folder again.','err');FS.state='off'}}
async function fsStop(){if(!confirm('Stop auto-saving? The folder and its files stay where they are.'))return;FS.dir=null;FS.state='off';await kvSet('dirHandle',null);render(true)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&FS.timer){clearTimeout(FS.timer);FS.timer=null;syncNow()}});


/* ================= install (PWA) ================= */
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function showInstallBtn(){const b=$('#install-btn');if(!b)return;b.hidden=isStandalone()||!(deferredInstall||isIOS()||location.protocol==='file:')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstallBtn()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;showInstallBtn();toast('Ledger installed. Open it from your apps or dock.');if(S.view==='settings')render(true)});
async function doInstall(){
  if(deferredInstall){deferredInstall.prompt();const r=await deferredInstall.userChoice;if(r.outcome==='accepted')deferredInstall=null;showInstallBtn();return}
  showModal(`<div class="mhead"><h2 style="margin:0">Install Ledger</h2><button class="x" data-act="close" aria-label="Close">×</button></div>${installHelp()}`)}
function installHelp(){
  if(location.protocol==='file:')return `<p>Installing needs the journal opened from a web address, not a file on your computer. Use your GitHub Pages link, or run <code>python3 -m http.server 8000</code> in the folder and open <code>http://localhost:8000</code>.</p>`;
  if(isIOS())return `<p>On iPhone or iPad, use Safari:</p><ol><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><p class="muted small">Folder auto-save doesn't work on iPhone. Use Download backup in Settings.</p>`;
  return `<p>In Chrome or Edge, click the install icon at the right of the address bar, or open the browser menu and choose <b>Install Ledger</b> (Chrome may list it under <b>Cast, save and share</b>).</p><p class="muted small">No option? It may already be installed, or you're in Firefox or Safari on a Mac, which can't install it.</p>`}
function installSection(){
  if(isStandalone())return `<section class="panel" id="install-panel"><h2>App</h2><p class="small">You're using the installed app. Updates arrive the next time you open it with internet.</p></section>`;
  return `<section class="panel" id="install-panel"><h2>Install as an app</h2><p class="muted small">Opens in its own window with a dock or home-screen icon, and works offline. Same journal, same data.</p>
   <div class="row"><button class="btn pri" data-act="install">Install Ledger</button></div></section>`}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
const HASH_VIEWS=['dashboard','analytics','trades','journal','gallery','import','settings'];
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(HASH_VIEWS.includes(v)&&v!==S.view)go(v)});

/* ================= router & global events ================= */
const VIEWS={dashboard:vDash,analytics:vAnalytics,trades:vTrades,journal:vJournal,gallery:vGallery,import:vImport,settings:vSettings};
function render(keep){const y=window.scrollY;$$('nav [data-view]').forEach(b=>{b.classList.toggle('on',b.dataset.view===S.view);b.setAttribute('aria-current',b.dataset.view===S.view?'page':'false')});
  VIEWS[S.view]($('#main'));if(fsSupported()&&!['settings','dashboard','analytics'].includes(S.view)){const b=noticeHTML(S.view);if(b){const hd=$('#main .head');hd?hd.insertAdjacentHTML('afterend',b):$('#main').insertAdjacentHTML('afterbegin',b)}}updateFsStatus();if(keep)window.scrollTo(0,y);else window.scrollTo(0,0)}
function go(v){S.view=v;S.selected.clear();render()}
const ACT={
  'range':a=>{S.filter.range=a.dataset.v;render(true)},
  'hide-motive':()=>{S.motiveHidden=todayStr();kvSet('motiveHidden',S.motiveHidden);render(true)},
  'cal':a=>{const [y,m]=S.cal.split('-').map(Number);const d=new Date(y,m-1+(+a.dataset.v),1);S.cal=d.getFullYear()+'-'+pad2(d.getMonth()+1);const p=$('#calp');if(p)p.innerHTML=calendarHTML(analyze(filtered()))},
  'open-day':a=>{S.jDate=a.dataset.d;go('journal')},
  'new-trade':()=>openTrade(null),
  'close':()=>closeModal(),
  'del-trade':()=>{if(!modalCtx||!confirm('Delete this trade? Its screenshots stay in the gallery.'))return;const id=modalCtx.id;S.trades=S.trades.filter(t=>t.id!==id);
    S.images.filter(i=>i.tradeId===id).forEach(i=>{i.tradeId=null;imgPut(i)});modalCtx.saved=true;save('trades');closeModal();render(true);toast('Trade deleted')},
  'more':()=>{S.tradeLimit+=200;render(true)},
  'del-selected':()=>{const n=S.selected.size;if(!confirm(`Delete ${n} trade${n>1?'s':''}?`))return;S.trades=S.trades.filter(t=>!S.selected.has(t.id));S.selected.clear();save('trades');render(true);toast(`Deleted ${n}`)},
  'clear-sel':()=>{S.selected.clear();render(true)},
  'export-csv':()=>exportCSV(),
  'j-today':()=>{S.jDate=todayStr();render()},
  'j-add-trade':()=>openTrade(null,{date:S.jDate}),
  'i-paste':()=>{const t=$('#i-paste').value;if(t.trim())impStart(t,'Pasted data')},
  'i-template':()=>download('ledger-template.csv','Date,Time,Exit Time,Symbol,Side,Qty,Entry,Exit,Stop,PnL,Fees,Account,Setup,Notes\n','text/csv'),
  'i-cancel':()=>{S.imp=null;render(true)},
  'fills-cancel':()=>{S.fills=null;render(true)},'fills-go':()=>fillsGo(),
  'fills-comm':a=>{const i=instOf(a.dataset.s);if(!i)return;i.commission=+a.dataset.v;recomputeAll();save('instruments');save('trades');toast(`${i.sym} commission set to ${money(+a.dataset.v,false)} per side`);render(true)},
  'i-go':()=>impGo(),
  'i-addpreset':a=>{if(CFD_PRESETS.some(p=>p[0]===a.dataset.s))addCfd(a.dataset.s);else addPreset(a.dataset.s);render(true)},
  'i-undo':a=>{const id=a.dataset.id;const n=S.trades.filter(t=>t.batch===id).length;if(!confirm(`Remove the ${n} trades from this import?`))return;S.trades=S.trades.filter(t=>t.batch!==id);S.imports=S.imports.filter(x=>x.id!==id);save('trades');save('imports');render(true);toast(`Removed ${n} trades`)},
  'add-preset':a=>{addPreset(a.dataset.s);render(true)},
  'add-inst':a=>{S.instruments.push(a.dataset.t==='cfd'?{sym:'NEWCFD',name:'',type:'cfd',contractSize:1,fx:1,commission:0,aliases:''}:{sym:'NEW',name:'',type:'future',tickSize:0.25,tickValue:1,commission:0,aliases:''});save('instruments');render(true)},
  'add-cfd':a=>{addCfd(a.dataset.s);render(true)},
  'del-inst':a=>{const i=S.instruments[+a.dataset.i];const n=S.trades.filter(t=>t.symbol===i.sym).length;if(n&&!confirm(`${n} trades use ${i.sym}. Their P&L will show as $0 unless the file supplied P&L. Remove anyway?`))return;S.instruments.splice(+a.dataset.i,1);recomputeAll();save('instruments');save('trades');render(true)},
  'add-acc':()=>{S.accounts.push({id:uid(),name:'Account '+(S.accounts.length+1),firm:'',start:null,daily:null,maxDD:null,ddType:'trailing',lock:true,target:null});save('accounts');render(true)},
  'del-acc':a=>{if(!confirm('Remove this account? Trades keep their account name.'))return;S.accounts.splice(+a.dataset.i,1);save('accounts');render(true)},
  'theme':a=>{S.settings.theme={...THEMES[a.dataset.n]};applyTheme();save('settings');render(true)},
  'add-ses':()=>{S.settings.sessions.push({name:'Session',start:'00:00',end:'01:00'});save('settings');render(true)},
  'del-ses':a=>{S.settings.sessions.splice(+a.dataset.i,1);recomputeAll();save('settings');render(true)},
  'backup':()=>backup(),
  'install':()=>doInstall(),
  'ach':()=>openAch(),
  'recap':()=>{const last=[...S.trades].sort(byDT).pop();if(!last){toast('No trades to recap yet');return}const R=recapData(weekStart(last.date));if(!R)return;showModal(recapHTML(R,true),true);bindRecap()},
  'hide-recap':()=>{const ws=weekStart(todayStr());S.weekly[ws]={...(S.weekly[ws]||{}),hidden:true};save('weekly');render(true)},
  'open-trade':a=>{const id=a.dataset.id;closeModal();openTrade(id)},
  'pick-acct':a=>{S.filter.account=S.filter.account===a.dataset.n?'':a.dataset.n;render(true)},
  'ror-unit':a=>{S.settings.ror.unit=a.dataset.v;save('settings');refreshRor()},
  'fs-choose':()=>fsChoose(),'fs-resolve':()=>{if(FS.pending)conflictModal(FS.pending.data,'Your journal folder has newer data')},
  'fs-later':()=>{S.fsNudge=Date.now()+7*864e5;kvSet('fsNudge',S.fsNudge);render(true)},'fs-reconnect':()=>fsReconnect(),'fs-now':async()=>{await syncNow(true);if(!FS.err)toast('Saved to folder')},'fs-stop':()=>fsStop(),'fs-load':()=>fsLoad(),'fs-overwrite':()=>fsOverwrite(),
  'restore':()=>$('#s-restore').click(),
  'wipe':async()=>{if(!confirm('Delete every trade, journal entry, screenshot and setting in this browser? Your auto-save folder is left untouched and auto-save is switched off.'))return;if(prompt('Type DELETE to confirm')!=='DELETE')return;
    FS.dir=null;FS.state='off';await kvSet('dirHandle',null);
    for(const k of KEYS){S[k]=k==='settings'?mergeDefaults(null):(Array.isArray(S[k])?[]:{});await kvSet(k,S[k])}await imgClear();S.images=[];applyTheme();toast('All data deleted');go('dashboard')},
};
function addCfd(sym){const p=CFD_PRESETS.find(x=>x[0]===sym);if(!p||instOf(sym))return;S.instruments.push({sym:p[0],name:p[1],type:'cfd',contractSize:p[2],fx:p[3],commission:0,aliases:p[4]});recomputeAll();save('instruments');save('trades');toast(`${sym} added. Check contract size against your broker.`)}
function addPreset(sym){const p=PRESETS.find(x=>x[0]===sym);if(!p||instOf(sym))return;S.instruments.push({sym:p[0],name:p[1],type:'future',tickSize:p[2],tickValue:p[3],commission:0,aliases:''});recomputeAll();save('instruments');save('trades');toast(`${sym} added. Set your commission in Settings.`)}

$('#install-btn').addEventListener('click',doInstall);
document.addEventListener('click',e=>{
  const nv=e.target.closest('nav [data-view]');if(nv){go(nv.dataset.view);return}
  const g=e.target.closest('[data-go]');if(g){if(modalCtx)closeModal();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a,e)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cal .d[data-act]')){e.preventDefault();ACT['open-day'](e.target)}});
document.addEventListener('paste',async e=>{
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(!files.length)return;e.preventDefault();
  if(modalCtx){const date=$('#tf [name=date]')?.value||modalCtx.date;await addImages(files,{tradeId:modalCtx.id,date});renderThumbs('#tf-thumbs',S.images.filter(i=>i.tradeId===modalCtx.id));return}
  if(S.view==='journal'){await addImages(files,{date:S.jDate});renderThumbs('#j-thumbs',S.images.filter(i=>i.date===S.jDate));return}
  await addImages(files,{date:todayStr(),auto:true});if(S.view==='gallery')render(true);else toast('Pasted screenshot saved to Screenshots')});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if((S.view==='dashboard'||S.view==='analytics')&&S.trades.length){const ts=filtered();if(ts.length)drawDash(analyze(ts,baseFor()))}},150)});

/* ================= init ================= */
(async function init(){
  try{db=await openDB()}catch(e){$('#main').innerHTML=`<div class="panel empty"><h2>Storage is blocked</h2><p>This browser won't let the page save data. Open it in Chrome, Edge or Firefox, or serve the folder locally (see the README).</p></div>`;return}
  for(const k of KEYS){const v=await kvGet(k);if(v!==undefined)S[k]=v}
  S.settings=mergeDefaults(S.settings);if(!Array.isArray(S.trades))S.trades=[];
  S.motiveHidden=(await kvGet('motiveHidden'))||'';
  S.images=(await imgAll())||[];
  recomputeAll();applyTheme();
  S.rev=(await kvGet('rev'))||0;S.fsNudge=(await kvGet('fsNudge'))||0;
  try{const d=await kvGet('dirHandle');if(d&&fsSupported()){FS.dir=d;if(await fsCheck())await fsStart()}}catch(e){}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  const hv=location.hash.slice(1);if(HASH_VIEWS.includes(hv))S.view=hv;
  showInstallBtn();render();
})();
</script>
</body>
</html>
